<!DOCTYPE html>
<html lang="en" data-theme="parchment" data-font="serif">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhiloNotes — Philosophy of Law Reader & Reviewer</title>
  <meta name="description" content="PhiloNotes — High-performance reader and study reviewer for Philosophy of Law notes, case briefs, and legal doctrines.">
  <meta property="og:title" content="PhiloNotes — Philosophy of Law Reader & Reviewer">
  <meta property="og:description" content="Law school reader with dynamic table of contents, instant case search, and customizable themes.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#B45309">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEMES
       ========================================================================== */
    :root {
      --font-serif: 'Merriweather', Georgia, Cambria, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Cinzel', Georgia, serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;

      --sidebar-width: 320px;
      --header-height: 68px;
      --content-max-width: 860px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* PARCHMENT THEME (Default - Classic Law Library) */
    html[data-theme="parchment"] {
      --bg-page: #FBF8F3;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #F4EFE6;
      --bg-sidebar: #F5EFE6;
      --text-primary: #231C18;
      --text-secondary: #5C5248;
      --text-muted: #8A7E73;
      --accent: #B45309;
      --accent-hover: #92400E;
      --accent-light: #FEF3C7;
      --border-color: #E8DDCF;
      --border-focus: #D97706;
      --code-bg: #EFE8DD;
      --blockquote-border: #B45309;
      --blockquote-bg: #FAF5ED;
      --table-header: #EFE8DD;
      --table-row-alt: #F9F6F0;
      --shadow-sm: 0 1px 3px rgba(35, 28, 24, 0.05);
      --shadow-md: 0 4px 12px rgba(35, 28, 24, 0.08);
      --shadow-lg: 0 12px 28px rgba(35, 28, 24, 0.12);
      --highlight-color: #FDE68A;
    }

    /* MIDNIGHT DARK THEME (Executive Modern Slate) */
    html[data-theme="dark"] {
      --bg-page: #0B0F19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1F2937;
      --bg-sidebar: #0E1424;
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --accent: #F59E0B;
      --accent-hover: #FBBF24;
      --accent-light: #78350F;
      --border-color: #1F2937;
      --border-focus: #F59E0B;
      --code-bg: #1F2937;
      --blockquote-border: #F59E0B;
      --blockquote-bg: #1A2234;
      --table-header: #1F2937;
      --table-row-alt: #131C2E;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.6);
      --highlight-color: #92400E;
    }

    /* EDITORIAL LIGHT THEME (Clean Minimalist White) */
    html[data-theme="light"] {
      --bg-page: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #F1F5F9;
      --bg-sidebar: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --accent: #0284C7;
      --accent-hover: #0369A1;
      --accent-light: #E0F2FE;
      --border-color: #E2E8F0;
      --border-focus: #0284C7;
      --code-bg: #F1F5F9;
      --blockquote-border: #0284C7;
      --blockquote-bg: #F8FAFC;
      --table-header: #F1F5F9;
      --table-row-alt: #F8FAFC;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.12);
      --highlight-color: #BAE6FD;
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-serif);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.8;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    html[data-font="sans"] body {
      font-family: var(--font-sans);
    }

    /* Reading Progress Bar */
    #progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: transparent;
      z-index: 1000;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #F59E0B);
      transition: width 0.1s linear;
    }

    /* ==========================================================================
       TOP APP HEADER
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      height: var(--header-height);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 900;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .btn-toggle-sidebar {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-toggle-sidebar:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--accent);
      color: var(--accent);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-title span.badge {
      font-family: var(--font-sans);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
    }

    /* Top Controls */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 2px;
    }

    .btn-control {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 10px;
      font-size: 0.82rem;
      font-family: var(--font-sans);
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition-smooth);
    }

    .btn-control:hover {
      color: var(--text-primary);
    }

    .btn-control.active {
      background: var(--bg-surface);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* Search Box in Header */
    .search-wrapper {
      position: relative;
      width: 260px;
    }

    .search-input {
      width: 100%;
      height: 38px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      padding: 0 2rem 0 0.85rem;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
      background: var(--bg-surface);
      width: 320px;
    }

    .search-count {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      pointer-events: none;
    }

    /* ==========================================================================
       MAIN CONTAINER & SIDEBAR LAYOUT
       ========================================================================== */
    .app-container {
      display: flex;
      min-height: calc(100vh - var(--header-height));
    }

    /* Sidebar Navigation */
    .app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      height: calc(100vh - var(--header-height));
      position: sticky;
      top: var(--header-height);
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      flex-shrink: 0;
      transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  visibility 0.25s ease;
      z-index: 800;
    }

    /* Desktop Collapsed State */
    .app-sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-width));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Backdrop for Mobile Off-Canvas */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 990;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .sidebar-backdrop.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Mobile Header Inside Sidebar */
    .sidebar-mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-mobile-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .btn-close-sidebar {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-close-sidebar:hover {
      background: var(--bg-surface-elevated);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Mobile In-Sidebar Search */
    .sidebar-search-box {
      display: none;
      position: relative;
      align-items: center;
      width: 100%;
    }

    .sidebar-search-box svg {
      position: absolute;
      left: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .sidebar-search-box .search-input {
      width: 100%;
      padding: 0.6rem 2.25rem 0.6rem 2.25rem;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .sidebar-search-box .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    .sidebar-search-box .search-count {
      position: absolute;
      right: 0.6rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .sidebar-section-title {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    /* Document Selector Dropdown / Pills */
    .doc-pill-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .doc-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-smooth);
      text-align: left;
    }

    .doc-pill:hover {
      color: var(--text-primary);
      border-color: var(--border-color);
      transform: translateX(2px);
    }

    .doc-pill.active {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* File Drop Zone / Custom File */
    .file-upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-smooth);
      background: var(--bg-surface);
    }

    .file-upload-zone:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Table of Contents List */
    .toc-container {
      flex: 1;
      overflow-y: auto;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .toc-item a {
      display: block;
      padding: 0.35rem 0.6rem;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      line-height: 1.4;
      transition: var(--transition-smooth);
      border-left: 2px solid transparent;
    }

    .toc-item a:hover {
      color: var(--accent);
      background: var(--bg-surface);
    }

    .toc-item.level-2 a {
      padding-left: 1.1rem;
      font-size: 0.78rem;
    }

    .toc-item.level-3 a {
      padding-left: 1.6rem;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .toc-item.active a {
      color: var(--accent);
      font-weight: 600;
      border-left-color: var(--accent);
      background: var(--bg-surface);
    }

    /* ==========================================================================
       MAIN READING VIEW
       ========================================================================== */
    .app-main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2.5rem 2rem 5rem 2rem;
      background-color: var(--bg-page);
    }

    .reading-article {
      width: 100%;
      max-width: var(--content-max-width);
      background: var(--bg-surface);
      padding: 3.5rem 4rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: var(--transition-smooth);
    }

    /* Dynamic Font Size Class */
    .text-sm { font-size: 0.92rem; }
    .text-base { font-size: 1.05rem; }
    .text-lg { font-size: 1.18rem; }
    .text-xl { font-size: 1.3rem; }

    /* ==========================================================================
       RICH MARKDOWN TYPOGRAPHY
       ========================================================================== */
    .reading-article h1,
    .reading-article h2,
    .reading-article h3,
    .reading-article h4 {
      color: var(--text-primary);
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.3;
      margin-top: 2.4rem;
      margin-bottom: 1rem;
      scroll-margin-top: calc(var(--header-height) + 1.5rem);
    }

    .reading-article h1 {
      font-size: 2.1rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-top: 0;
      color: var(--text-primary);
    }

    .reading-article h2 {
      font-size: 1.55rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      color: var(--accent);
    }

    .reading-article h3 {
      font-size: 1.25rem;
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--text-primary);
    }

    .reading-article h4 {
      font-size: 1.05rem;
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .reading-article p {
      margin-bottom: 1.4rem;
      color: var(--text-primary);
    }

    .reading-article a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: var(--transition-smooth);
    }

    .reading-article a:hover {
      color: var(--accent-hover);
    }

    .reading-article strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    .reading-article em {
      font-style: italic;
    }

    /* Quotes and Legal Maxims */
    .reading-article blockquote {
      border-left: 4px solid var(--blockquote-border);
      background: var(--blockquote-bg);
      padding: 1.25rem 1.75rem;
      margin: 1.8rem 0;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-style: italic;
      color: var(--text-secondary);
      box-shadow: inset 1px 0 0 rgba(0,0,0,0.02);
    }

    .reading-article blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Lists */
    .reading-article ul,
    .reading-article ol {
      margin-bottom: 1.5rem;
      padding-left: 1.8rem;
    }

    .reading-article li {
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .reading-article li::marker {
      color: var(--accent);
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 2rem 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .reading-article table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      margin: 0;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      overflow: hidden;
    }

    .reading-article th,
    .reading-article td {
      padding: 0.85rem 1.1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .reading-article th {
      background: var(--table-header);
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .reading-article tr:nth-child(even) {
      background: var(--table-row-alt);
    }

    .reading-article tr:hover {
      background: var(--bg-surface-elevated);
    }

    /* Code and Latin Maxims */
    .reading-article code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 0.2em 0.45em;
      border-radius: var(--radius-sm);
      color: var(--accent);
    }

    .reading-article pre code {
      display: block;
      padding: 1.25rem;
      overflow-x: auto;
      border-radius: var(--radius-md);
      line-height: 1.6;
    }

    .reading-article hr {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 3rem 0;
    }

    /* Highlight Search Match */
    mark.search-match {
      background: var(--highlight-color);
      color: inherit;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    mark.search-match.current {
      outline: 2px solid var(--accent);
      box-shadow: 0 0 8px rgba(180, 83, 9, 0.4);
    }

    /* Quick Action Buttons (Print / Back to Top) */
    .floating-actions {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 800;
    }

    .fab-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .fab-btn:hover {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Quick Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1200;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ==========================================================================

    const bundledDocs = {"page_by_page_summary": {"label": "📘 Page-by-Page Summary (Aquino)", "content": "# PHILOSOPHY OF LAW: COMPLETE PAGE-BY-PAGE SUMMARY & CASE REPOSITORY\r\n**Textbook:** *Philosophy of Law* (Chapters 1 to 3)  \r\n**Author:** David Robert C. Aquino, LL.M.  \r\n**Coverage:** Chapter 1 (Preliminary Considerations), Chapter 2 (Schools of Thought), Chapter 3 (Law and Government) — Pages 1 to 125  \r\n**Purpose:** Comprehensive Law School Study Guide, Page-by-Page Analytical Summary, and Case Law Compendium\r\n\r\n---\r\n\r\n## TABLE OF CONTENTS\r\n1. [Chapter 1: Preliminary Considerations (Pages 1 to 35)](#chapter-1-preliminary-considerations-pages-1-to-35)\r\n   - Pages 1–15: Nature of Philosophy, Partnership with Law, The Spirit vs. Letter of the Law (*Alonzo v. IAC*, *League of Cities v. COMELEC*, *DCCCO v. CIR*)\r\n   - Pages 16–26: History of Philippine Law, Separation of Powers, Qualified Political Agency, Judicial Review Requisites (*Ilagan v. Enrile*, *Republic v. Sandiganbayan*, *Angara v. Electoral Commission*, *Villena v. Secretary of the Interior*)\r\n   - Pages 27–35: Constitutional Commissions (CSC, COMELEC, COA), Scope of Powers, Jurisprudence (*Luego v. CSC*, *Lapinid v. CSC*, *Gallardo v. Tabamo*, *Dingcong v. Guingona*)\r\n2. [Chapter 2: Schools of Thought (Pages 36 to 66)](#chapter-2-schools-of-thought-pages-36-to-66)\r\n   - Pages 36–41: Classical vs. Positivist Criminal Law, Natural Law Theory, Natural Rights vs. Civil Rights (*Republic v. Sandiganbayan*, *Mobil Oil v. Diocares*)\r\n   - Pages 42–47: Legal Positivism (Social Fact, Conventionality, and Separability Theses; Austin, Hart, Kelsen; *Switzerland General Insurance v. Republic*)\r\n   - Pages 48–57: Legal Realism (Holmes, The Path of the Law, The Bad Man Theory, Operative Fact Doctrine, Stare Decisis; *Municipality of Malabang v. Benito*, *Gomez v. Palomar*, *Lambino v. COMELEC*, *Planned Parenthood v. Casey*)\r\n   - Pages 58–62: Interpretivism & Constructivism (Dworkin, Hard Cases, Equity over Form; *Salvacion v. Central Bank*, *People v. Acierto*)\r\n   - Pages 63–66: The Pure Theory of Law (Kelsen's Grundnorm), Sociological Jurisprudence (Ehrlich, Pound), Historical School (Savigny's Volksgeist)\r\n3. [Chapter 3: Law and Government (Pages 67 to 125)](#chapter-3-law-and-government-pages-67-to-125)\r\n   - Pages 67–76: Rudiments of the State (Aristotle's *Politics*, People, Territory, Government), Constituent vs. Ministrant Functions, Parens Patriae (*US v. Dorr*, *Bacani v. NACOCO*, *Monte de Piedad*, *Southern Luzon Drug Corp.*)\r\n   - Pages 77–79: De Jure vs. De Facto Governments, Three Types of De Facto Regimes, Belligerent Occupation (*Co Kim Cham v. Valdez Tan Keh*, *Lawyers League v. Aquino*)\r\n   - Pages 80–92: Inherent Powers of the State: Police Power, Eminent Domain, Taxation (*Sangalang v. IAC*, *Republic v. Ortigas*, *Capitol Subdivision v. Negros Occ.*, *CIR v. Algue*)\r\n   - Pages 93–99: Sovereignty, State Immunity from Suit (Jure Imperii vs. Jure Gestionis), Immunity of Foreign States and Diplomats (*Sanders v. Veridiano II*, *Arigo v. Swift*, *Republic of Indonesia v. Vinzon*, *Baer v. Tizon*)\r\n   - Pages 100–103: Political Question Doctrine vs. Expanded Judicial Review, Revolutionary Legitimacy of the 1986 EDSA Government (*Javellana v. Executive Secretary*, *In re Bermudez*, *Tatad v. Secretary of Energy*)\r\n   - Pages 104–113: Constitutional Construction & Interpretation, Plain Meaning Rule, Self-Executing Provisions, Filipino First Policy (*Kilosbayan v. Guingona*, *Manila Prince Hotel v. GSIS*, *Francisco v. House of Representatives*)\r\n   - Pages 114–125: Rule of Law vs. Government of Men, Judicial Conscience vs. Mandatory Penalties, Habeas Corpus, Republicanism, Public Office as Public Trust, Social Justice (*People v. Veneracion*, *Villavicencio v. Lukban*, *Guido v. RPA*, *Sta. Maria v. Lopez*)\r\n\r\n---\r\n\r\n# CHAPTER 1: PRELIMINARY CONSIDERATIONS (Pages 1 to 35)\r\n\r\n---\r\n\r\n### Page 1: Philosophy and the Law — The Natural Partnership\r\n- **Epigraph:** Jacob Bronowski (*The Ascent of Man*): Nature has not fitted man to any specific environment; man's imagination, reason, and emotional subtlety allow him not merely to accept his environment, but to actively reshape it through cultural evolution.\r\n- **Core Philosophical Concepts:**\r\n  - **The Partnership:** Law and philosophy form a natural alliance. Law brings a penchant for order, structure, stability, and predictability; philosophy injects dynamism, inquisitive critique, and adaptability. Without philosophy, law ossifies into rigid formalism; without law, philosophical ideas lack social enforceability.\r\n  - **Inquiry into the Compulsory Nature of Law:** Philosophy goes beyond positive statutes to explore the fundamental questions: *What is the essential nature of law? What justifies the State's coercive power to compel obedience? When is obedience a moral duty, and when is resistance justified?*\r\n\r\n---\r\n\r\n### Page 2: Expanding Law to Justice and Equity & The Nature of Philosophy\r\n- **Core Concepts:**\r\n  - **Law Beyond Mere Regulation:** Philosophical inquiry elevates positive law from a cold regulatory apparatus into a genuine instrument of justice, human dignity, and equity.\r\n  - **Philosophy as Inquisitive Inquiry:** Philosophy does not accept norms simply because they are established by tradition or enacted by sovereign decree. Its currency is the question \"Why?\" It forces legal institutions to examine their unstated biases, empirical assumptions, and ethical justifications.\r\n  - **Reason and Spirit of the Law Introduced:** While the courts must maintain fidelity to enacted statutes, mechanical adherence to verbal form often produces results that contradict the very reason the law was made.\r\n\r\n---\r\n\r\n### Page 3: Letter vs. Spirit of the Law — Judicial Duty and Discretion\r\n- **Core Concepts:**\r\n  - **The Peril of Pure Judicial Subjectivity:** While courts must pursue justice, judges cannot simply substitute their subjective sense of fairness for positive law. Goodness of purpose alone does not authorize judges to dispense with legislative sanction; doing so would make the stability of legal institutions dependent upon aleatory (chance) events (*Pascual v. Santos*).\r\n  - **Statutory Interpretation Principle:** The court's role is to discover legislative intent. Courts must harmonize positive commands with the fundamental purpose of the statute.\r\n- **Case Spotlight:**\r\n  - **Pascual v. Santos, 62 Phil. 148 (1935):**\r\n    - *Facts:* Parties sought to set aside clear statutory formalities on the ground that the equities of the case justified a departure from statutory text.\r\n    - *Ruling:* The Supreme Court held that the goodness and excellence of purpose in themselves alone do not justify the courts in employing ways and means that require legislative sanction. Disregarding statutory provisions under the guise of equity destabilizes the legal order.\r\n\r\n---\r\n\r\n### Page 4: Alonzo v. Intermediate Appellate Court — The Triumph of Equity\r\n- **Core Discussion & Case Analysis:**\r\n  - **Alonzo v. Intermediate Appellate Court, 150 SCRA 259 (1987) (Ponente: Justice Isagani Cruz):**\r\n    - *Facts:* Five siblings inherited a parcel of land. Two siblings sold their undivided shares to spouses Alonzo in 1963 and 1964. The purchasers took open, public possession and built a semi-concrete house thereon. Over a decade later (1976), the remaining co-heirs filed an action to redeem the shares pursuant to Article 1088 of the Civil Code, which grants co-heirs a 30-day right of legal redemption *from the time they are notified in writing by the vendor*. The co-heirs claimed that since no formal *written* notice was ever served on them, the 30-day redemption period never started running.\r\n    - *Legal & Philosophical Issue:* Must the requirement of *written* notice under Article 1088 be applied literally to allow redemption decades later, even though the co-heirs had undisputed actual knowledge of the sale for over 13 years?\r\n    - *Ruling & Jurisprudential Takeaway:* The Supreme Court held that actual knowledge satisfied the statutory requirement. Justice Cruz penned the immortal doctrine: *\"While we admittedly may not legislate, we nevertheless have the power to interpret the law in such a way as to reflect the will of the legislature. While we may not read into the law a purpose that is not there, we nevertheless have the right to read out of it the reason for its enactment. In doing so, we defer not to the letter that killeth but to the spirit that vivifieth.\"* To grant redemption after 13 years of silence would weaponize a protective statute into an instrument of extortion and injustice.\r\n\r\n---\r\n\r\n### Page 5: The Spirit that Vivifieth & Canons of Construction\r\n- **Core Discussion:**\r\n  - **The Principle:** *\"The spirit, rather than the letter of a statute determines its construction; hence, a statute must be read according to its spirit or intent.\"* What is within the spirit is within the statute even if not within the letter; what is within the letter but not within the spirit is excluded.\r\n  - **Supporting Canons & Authorities:** Citing *US v. Go Chico* (14 Phil. 128), *Roa v. Collector of Customs* (23 Phil. 315), *Hidalgo v. Hidalgo* (33 SCRA 105), and *People v. Purisima* (86 SCRA 542).\r\n  - **Introduction to the League of Cities Controversy:** The chapter introduces the contentious cityhood cases testing statutory intent vs. constitutional uniformity under Article X, Section 10 of the 1987 Constitution.\r\n\r\n---\r\n\r\n### Page 6: League of Cities of the Philippines (LCP) v. COMELEC — The Statutory Context\r\n- **Core Discussion & Case Analysis:**\r\n  - **League of Cities of the Philippines (LCP) v. Commission on Elections, 608 SCRA 636 (2009):**\r\n    - *Facts:* Under the Local Government Code of 1991 (RA 7160), a municipality needed an average annual income of at least Php 20 million to be converted into a component city. During the 11th Congress, several municipalities filed cityhood bills, but Congress adjourned before they were enacted. Subsequently, Congress passed Republic Act No. 9009 (effective June 30, 2001), amending Section 450 of RA 7160 by dramatically increasing the income requirement from Php 20 million to Php 100 million in locally generated funds to prevent indiscriminate conversions.\r\n\r\n---\r\n\r\n### Page 7: LCP v. COMELEC — Exemption Bills and the Constitutional Challenge\r\n- **Core Discussion & Case Analysis:**\r\n  - *Facts Continued:* During the Senate deliberations on RA 9009, Senator Aquilino Pimentel noted that municipalities whose cityhood bills had already been pending should not be unfairly prejudiced by the sudden jump to Php 100 million. Consequently, in the 12th and 13th Congresses, 16 municipalities filed individual cityhood bills containing an express exemption clause exempting them from the Php 100 million requirement of RA 9009. The bills lapsed into law. The League of Cities challenged the 16 Cityhood Laws as unconstitutional violations of Section 10, Article X of the Constitution (which mandates that criteria for city creation must be set forth in the Local Government Code itself, not in special laws) and the Equal Protection Clause.\r\n\r\n---\r\n\r\n### Page 8: Presumption of Constitutionality and Judicial Deference\r\n- **Core Concepts:**\r\n  - **Presumption of Validity:** Every statute enacted by the people's elected representatives enjoys a heavy presumption of constitutionality. An act will be struck down only when its conflict with the fundamental law is clear, unequivocal, and beyond reasonable doubt.\r\n  - **Legislative Intent as Part of the Statute:** The Supreme Court emphasized that legislative intent is not an extraneous ornament; it is the soul of the law. The debates during the passage of RA 9009 proved that Congress never intended to apply the Php 100 million threshold to the 16 pending municipalities.\r\n\r\n---\r\n\r\n### Page 9: Procedural Dimensions and Substantial Justice\r\n- **Core Concepts & Case Holding:**\r\n  - **Power to Suspend Rules:** The Supreme Court reiterated its inherent power to suspend its own procedural rules (even after multiple motions for reconsideration) where paramount public interest and substantial justice demand resolution.\r\n  - **Substantive Equal Protection:** The 16 municipalities formed a valid distinct class from all other municipalities because their cityhood applications were already pending before RA 9009 took effect. Denying them conversion would punish them for legislative delays beyond their control.\r\n  - **Transition to DCCCO v. CIR:** The chapter transitions to tax law to demonstrate that even in taxation—where exemptions are traditionally construed *strictissimi juris*—the spirit of the law governs over rigid formalism.\r\n\r\n---\r\n\r\n### Page 10: Dumaguete Cathedral Credit Cooperative (DCCCO) v. CIR — The Withholding Tax Dilemma\r\n- **Case Spotlight:**\r\n  - **Dumaguete Cathedral Credit Cooperative (DCCCO) v. Commissioner of Internal Revenue, 610 SCRA 652 (2010):**\r\n    - *Facts:* DCCCO, a duly registered credit cooperative, was assessed deficiency withholding taxes on interest paid to its members on their savings and time deposits by the Bureau of Internal Revenue (BIR) for taxable years 1999 and 2000 under Section 24(B)(1) of the National Internal Revenue Code (NIRC).\r\n    - *Legal Issue:* Are credit cooperatives legally required to withhold 20% final tax on interest earned by their members on their deposits?\r\n    - *Philosophical Principle Cited:* Citing *Tañada v. Cuenco* (103 Phil. 1051) and *Alonzo v. IAC*, the Court affirmed that the spirit prevails over the letter; what is within the intent of the legislature is within the statute.\r\n\r\n---\r\n\r\n### Page 11: NIRC Sec. 24(B)(1) vs. Cooperative Code — Statutory Harmonization\r\n- **Core Concepts:**\r\n  - **The Principle of Ejusdem Generis:** Section 24(B)(1) of the NIRC imposes a 20% final withholding tax on interest from \"any currency bank deposit and yield or any other monetary benefit from deposit substitutes and from trust funds and similar arrangements.\" The term \"similar arrangements\" must be construed in light of preceding banking terms.\r\n  - **Cooperatives Are Not Banks:** Cooperatives are democratically controlled self-help institutions organized for social and economic mutual benefit, not commercial profit-seeking banking entities.\r\n\r\n---\r\n\r\n### Page 12: Legislative Policy on Cooperatives (RA 6938)\r\n- **Core Discussion:**\r\n  - **Cooperative Charter:** Articles 61 and 62 of Republic Act No. 6938 (Cooperative Code of the Philippines) explicitly grant cooperatives preferential tax exemptions from all national taxes to foster capital accumulation and self-reliance among underprivileged classes.\r\n  - **Legislative Intent as Social Justice:** The fundamental purpose of cooperative legislation is constitutional: to distribute wealth, democratize ownership, and uplift small producers and consumers.\r\n\r\n---\r\n\r\n### Page 13: Strict Construction of Tax Exemptions vs. Teleological Intent\r\n- **Core Concepts:**\r\n  - **The Canon of Construction:** While exemptions from taxation are construed strictly against the taxpayer, this canon cannot be stretched to the point of frustrating the explicit social intent of the legislature.\r\n  - **Teleological Interpretation:** A statute must be read in the context of its overarching legislative scheme. Taxing the modest interest earned by cooperative members on their deposits would destroy the very economic incentive Congress deliberately created to encourage grassroots savings.\r\n\r\n---\r\n\r\n### Page 14: Administrative Rulings vs. Statutory Mandates\r\n- **Core Discussion:**\r\n  - **Conflicting BIR Positions:** The BIR's flip-flopping administrative rulings (imposing withholding taxes despite the clear policy of RA 6938) were rejected by the Court.\r\n  - **Principle:** Administrative regulations cannot supersede, expand, or restrict statutory enactments. Administrative agencies cannot defeat legislative intent through bureaucratic literalism.\r\n\r\n---\r\n\r\n### Page 15: Ruling in DCCCO v. CIR — Social Justice in Statutory Construction\r\n- **Ruling & Jurisprudential Takeaway:**\r\n  - The Supreme Court ruled in favor of DCCCO, holding that members' savings and time deposits in credit cooperatives are exempt from final withholding tax.\r\n  - **Doctrinal Legacy:** When interpreting tax provisions affecting social justice institutions, courts must look to the legislative soul of the statute. Law is an instrument of human flourishing, not an obstacle course of punitive technicalities.\r\n\r\n---\r\n\r\n### Page 16: Philosophy of Government and Human Rights — The Puno and Abad Santos Dissents\r\n- **Core Concepts:**\r\n  - **The State as Servant of the People:** The State is not an end in itself; it is a servant designed to secure the happiness, liberty, and welfare of the individual.\r\n- **Key Judicial Opinions:**\r\n  - **Justice Reynato S. Puno (Separate Opinion in Republic v. Sandiganbayan, 407 SCRA 10 [2003]):** Explores the natural law foundation of fundamental rights, explaining that individuals possess inherent dignity and rights that exist independently of positive constitutional enactments.\r\n  - **Justice Vicente Abad Santos (Dissenting Opinion in Ilagan v. Enrile, 139 SCRA 349 [1985]):** A ringing denunciation of martial law abuses, reminding the judiciary that its paramount obligation is the preservation of human liberty against executive totalitarianism.\r\n\r\n---\r\n\r\n### Page 17: Natural Law as the Moral Fiber of the Filipino People\r\n- **Core Concepts:**\r\n  - **Natural Law in Philippine Jurisprudence:** Invoking natural law is not merely an abstract academic exercise; in the Philippine constitutional order, the people are the ultimate source of sovereignty, and positive law must conform to their shared sense of fundamental justice and equity.\r\n  - **Sovereign Authority:** Courts derive their authority from the people; judicial decisions must therefore embody the moral expectations and ethical commitments of the community.\r\n\r\n---\r\n\r\n### Page 18: American Origins of Philippine Constitutional Institutions\r\n- **Core Concepts:**\r\n  - **Historical Evolution:** Following the Spanish-American War and the Treaty of Paris, American public law was transplanted to the Philippines (President McKinley's Instructions, the Philippine Bill of 1902, the Jones Law of 1916, and the 1935 Constitution).\r\n  - **Transplanted Concepts:** Republicanism, representative democracy, separation of powers, bicameralism, judicial review, and the Bill of Rights became the bedrock of the Philippine constitutional republic.\r\n\r\n---\r\n\r\n### Page 19: Separation of Powers & Checks and Balances\r\n- **Core Concepts:**\r\n  - **Coordinate and Co-Equal Branches:** The three great branches of government—Executive, Legislative, and Judiciary—are coordinate, co-equal, and independent within their allocated constitutional spheres.\r\n- **Case Spotlight:**\r\n  - **Luzon Stevedoring Corporation v. Social Security Commission, 34 SCRA 178 (1970):**\r\n    - *Principle:* Separation of powers is not a pedantic, doctrinaire dogma of hermetic isolation; it is a practical mechanism of statecraft that allows reasonable administrative flexibility while maintaining structural equilibrium. Citing *Angara v. Electoral Commission* (63 Phil. 139).\r\n\r\n---\r\n\r\n### Page 20: Justice Laurel's Classic Formulations of Separation of Powers\r\n- **Key Jurisprudential Text:**\r\n  - **Justice Jose P. Laurel's Masterpiece in Angara v. Electoral Commission (63 Phil. 139 [1936]) and Planas v. Gil (67 Phil. 62 [1939]):**\r\n    - Separation of powers was conceived not to foster efficiency, but to preclude arbitrary power. It divides governance into three grand departments: the Legislative makes laws, the Executive executes them, and the Judiciary interprets and applies them in actual controversies.\r\n  - **Villena v. Secretary of the Interior, 67 Phil. 451 (1939):**\r\n    - The Executive power is vested in a single President; subordinate officials act under presidential direction.\r\n\r\n---\r\n\r\n### Page 21: The Constitution as a Living Charter of Limitation\r\n- **Core Concepts:**\r\n  - **Charter of Limitations:** The Constitution is not an authorization for unlimited governmental action; it is a solemn instrument of restriction. If these restrictions are breached, the judiciary must intervene; otherwise, constitutional guarantees would be mere high-sounding words.\r\n- **Case Reference:**\r\n  - **Ilagan v. Enrile, 139 SCRA 349 (1985):**\r\n    - Critical reflection on the suspension of the writ of habeas corpus and warrantless detention of human rights lawyers during Martial Law.\r\n\r\n---\r\n\r\n### Page 22: The Executive Department & The Alter Ego Doctrine\r\n- **Core Concepts:**\r\n  - **Function:** The Executive executes and applies the law.\r\n- **Key Doctrines & Cases:**\r\n  - **Doctrine of Qualified Political Agency (Alter Ego Doctrine):** Enunciated by Justice Laurel in *Villena v. Secretary of the Interior* (67 Phil. 464). The President cannot be expected to personally attend to every single administrative detail; hence, the acts of Department Secretaries, performed in the regular course of business, are presumptively the acts of the Chief Executive unless disapproved or reprobated by the President.\r\n  - **DENR v. DENR Region 12 Employees, 409 SCRA 359 (2003):** Confirms presidential control over the executive branch and regional offices.\r\n  - **Government of the Philippine Islands v. Springer, 50 Phil. 276 (1927):** Congress cannot usurp executive appointments or execution.\r\n\r\n---\r\n\r\n### Page 23: The Legislative Department — Powers and Limitations\r\n- **Core Concepts:**\r\n  - **Function:** The Legislature prescribes general rules for the government of society.\r\n  - **Broad Plenary Power & Constraints:** Plenary authority to enact, amend, and repeal laws, subject to constitutional limitations (e.g., Bill of Rights, non-delegation of legislative power, prohibitions on ex post facto laws and bills of attainder).\r\n- **Cases:**\r\n  - *Honasan II v. Panel of Investigating Prosecutors of the DOJ* (427 SCRA 46 [2004]): Non-legislative oversight and inquiry powers.\r\n  - *Occeña v. COMELEC* (95 SCRA 759 [1980]): Constituent power to propose constitutional amendments.\r\n  - *Executive Secretary v. Court of Appeals* (429 SCRA 81 [2004]): Statutory penalties and legislative discretion.\r\n\r\n---\r\n\r\n### Page 24: The Judicial Department — Judicial Power & \"Judicial Supremacy\"\r\n- **Core Concepts:**\r\n  - **Definition of Judicial Power (Art. VIII, Sec. 1, 1987 Constitution):**\r\n    1. The traditional duty to settle actual controversies involving rights which are legally demandable and enforceable.\r\n    2. The *expanded power* to determine whether there has been grave abuse of discretion amounting to lack or excess of jurisdiction on the part of any branch or instrumentality of the government.\r\n- **Landmark Doctrine:**\r\n  - **Angara v. Electoral Commission, 63 Phil. 139 (1936):**\r\n    - *Doctrine of Judicial Supremacy:* When the judiciary arbitrates disputes between the political branches or strikes down an unconstitutional act, it does not assert superiority over the other branches. It merely asserts the supremacy of the Constitution. The Court is the ordained keeper of the constitutional balance.\r\n  - *Kilosbayan v. Morato* (G.R. No. 118910 [1995]) and *Lamb v. Phipps* (22 Phil. 559): Limits on mandamus and justiciable controversies.\r\n\r\n---\r\n\r\n### Page 25: Presumption of Constitutionality and Judicial Restraint\r\n- **Core Concepts:**\r\n  - **Judicial Deference:** Striking down an act of Congress or the Executive is the gravest responsibility of the Court. Courts will not decide constitutional questions unless absolutely unavoidable.\r\n- **Case Reference:**\r\n  - **Association of Small Landowners v. Secretary of Agrarian Reform, 175 SCRA 343 (1989):**\r\n    - Comprehensive agrarian reform program (CARP) sustained under police power and eminent domain; courts accord great deference to legislative policy choices designed to implement social justice.\r\n\r\n---\r\n\r\n### Page 26: The Four Essential Requisites of Judicial Review\r\n- **Core Doctrinal Framework:**\r\n  Before a court will exercise judicial review to test the constitutionality of a law or executive act, four conditions must concur:\r\n  1. **Actual Case or Controversy:** An actual conflict of legal rights susceptible of judicial determination, as opposed to a moot, academic, or hypothetical query.\r\n  2. **Proper Party (Locus Standi):** The petitioner must demonstrate a personal and substantial interest in the controversy, showing that they have suffered or are in immediate danger of suffering direct injury.\r\n  3. **Earliest Opportunity:** The constitutional issue must be raised in the pleadings at the earliest possible stage in the trial court (subject to exceptional jurisdictional exceptions).\r\n  4. **Lis Mota:** The constitutional question must be the very *lis mota* (the central issue/pivot) of the case, such that the dispute cannot be resolved on any other statutory or procedural ground.\r\n- **Key Authorities:** *Arceta v. Mangrobang* (432 SCRA 136), *Municipality of Malabang v. Benito* (27 SCRA 533), *Sanlakas v. Executive Secretary* (421 SCRA 656), *La Bugal-B'laan Tribal Association v. Ramos* (421 SCRA 148).\r\n\r\n---\r\n\r\n### Page 27: Independent Constitutional Commissions — Nature and Fiscal Autonomy\r\n- **Core Concepts:**\r\n  - **The Three Independent Commissions:** The 1987 Constitution established three independent constitutional bodies: the Civil Service Commission (CSC), the Commission on Elections (COMELEC), and the Commission on Audit (COA).\r\n  - **Fiscal Autonomy:** To guarantee their absolute independence from presidential retaliation or legislative coercion, these commissions enjoy fiscal autonomy—their approved appropriations are automatically and regularly released.\r\n- **Case Spotlight:**\r\n  - **CHREA v. Commission on Human Rights, 444 SCRA 300 (2004):** Examines the distinction between constitutionally created commissions and statutory agencies, affirming that fiscal autonomy protects independent regulatory and adjudicative integrity.\r\n\r\n---\r\n\r\n### Page 28: Adjudicative Powers and Judicial Review under Rule 64\r\n- **Core Concepts:**\r\n  - **60-Day Decision Rule:** Constitutional commissions must decide any case or matter submitted before them by a majority vote of all members within sixty (60) days from the date of submission.\r\n  - **Judicial Review via Certiorari:** Decisions, orders, or rulings of the CSC, COMELEC, and COA are reviewable exclusively by the Supreme Court on certiorari under Rule 64 (in relation to Rule 65) of the Rules of Court, limited to grounds of grave abuse of discretion amounting to lack or excess of jurisdiction.\r\n- **Authority:** *Career Executive Service Board (CESB) v. Civil Service Commission*, 819 SCRA 482 (2017).\r\n\r\n---\r\n\r\n### Page 29: The Civil Service Commission (CSC) — Scope and Powers\r\n- **Core Discussion:**\r\n  - **Central Personnel Agency:** The CSC is the central personnel agency of the Philippine Government, covering all branches, subdivisions, instrumentalities, and government-owned or controlled corporations (GOCCs) with original charters.\r\n  - **Statutory Charter:** Governed by Book V, Title I, Subtitle A of Executive Order No. 292 (Administrative Code of 1987).\r\n- **Cases:**\r\n  - *Feliciano v. Department of National Defense* (844 SCRA 401 [2017]): Scope of civil service coverage.\r\n  - *Cerilles v. Civil Service Commission* (846 SCRA 15 [2017]): Administrative disciplinary jurisdiction.\r\n  - *Galindo v. Commission on Audit* (814 SCRA 73 [2017]): Interplay between CSC personnel actions and COA disallowance.\r\n\r\n---\r\n\r\n### Page 30: Merit and Fitness in Public Office & Introduction to Luego v. CSC\r\n- **Core Concepts:**\r\n  - **Public Office is a Public Trust:** Public officers must at all times be accountable to the people.\r\n  - **Merit and Fitness System:** Appointments in the civil service must be made solely according to merit and fitness, determined as far as practicable by competitive examination (except policy-determining, primarily confidential, or highly technical positions).\r\n- **Introduction to Luego v. CSC (143 SCRA 327 [1986]):** Tests the boundary between the power of appointment and the power of approval.\r\n\r\n---\r\n\r\n### Page 31: Luego v. CSC & Lapinid v. CSC — Appointing Authority vs. CSC Approval Power\r\n- **Landmark Jurisprudence:**\r\n  - **Luego v. Civil Service Commission, 143 SCRA 327 (1986):**\r\n    - *Facts:* Luego was appointed Administrative Officer II by the City Mayor. The appointment was permanent. A rival employee protested before the CSC. The CSC revoked Luego's appointment and directed the appointment of the rival claimant, asserting that the rival had superior qualifications.\r\n    - *Ruling:* The Supreme Court reversed the CSC. The power of appointment is an essentially discretionary executive function vested in the appointing authority. The CSC's authority is strictly limited to approving the appointment upon verifying that the appointee possesses the minimum statutory qualifications, or disapproving it if they do not. The CSC has *no authority to substitute its judgment for that of the appointing authority* by choosing who is better qualified.\r\n  - **Lapinid v. Civil Service Commission, 197 SCRA 106 (1991):**\r\n    - Reaffirmed *Luego* with finality, ruling that the CSC cannot revoke a valid permanent appointment simply because another candidate is more experienced.\r\n\r\n---\r\n\r\n### Page 32: The Commission on Elections (COMELEC) — Constitutional Mandate\r\n- **Core Concepts:**\r\n  - **Guardian of Suffrage:** COMELEC is the constitutional guardian of the ballot, mandated to ensure free, orderly, honest, peaceful, and credible elections.\r\n- **Key Jurisprudence:**\r\n  - **Gallardo v. Tabamo, 218 SCRA 253 (1993):**\r\n    - *Facts:* A candidate in the May 1992 elections obtained an injunction from a Regional Trial Court (RTC) restraining the respondent Governor from implementing provincial public works projects alleged to be in violation of the election ban on public funds.\r\n    - *Ruling:* The RTC had no jurisdiction. Exclusive jurisdiction over the enforcement of election laws, including the prohibition against the disbursement of public funds during the election campaign period, belongs exclusively to the COMELEC.\r\n  - **Information Technology Foundation of the Philippines (ITF) v. COMELEC, 419 SCRA 141 (2004):** Nullification of the Mega-Pacific automated voting contract due to egregious bidding irregularities.\r\n\r\n---\r\n\r\n### Page 33: Exclusive Jurisdiction Over Election Offenses\r\n- **Core Concepts:**\r\n  - **Broad Administrative and Quasi-Judicial Reach:** COMELEC possesses the exclusive constitutional authority to investigate and prosecute election offenses.\r\n- **Authorities:**\r\n  - *Cipriano v. COMELEC* (436 SCRA 45 [2004]): Cancellation of certificates of candidacy and due process.\r\n  - *Salic v. COMELEC* (425 SCRA 735 [2004]): COMELEC jurisdiction over pre-proclamation controversies and failure of elections.\r\n  - *De Jesus v. Commission on Audit* (422 SCRA 287 [2004]): Interplay between election administration and audit rules.\r\n\r\n---\r\n\r\n### Page 34: The Commission on Audit (COA) — The Watchdog of Public Funds\r\n- **Core Concepts:**\r\n  - **Constitutional Function:** COA is the supreme constitutional watchdog over public funds, empowered to examine, audit, and settle all accounts pertaining to revenue, receipts, and expenditures of government funds and properties.\r\n  - **Power of Disallowance:** COA has the authority to prevent and disallow irregular, unnecessary, excessive, extravagant, or unconscionable expenditures.\r\n- **Key Jurisprudence:**\r\n  - **Dingcong v. Guingona, 162 SCRA 782 (1988):** Affirms COA's comprehensive jurisdiction over government-owned banks and public corporations.\r\n  - *KMG v. COA* (437 SCRA 371 [2004]): Disallowance of unauthorized allowances.\r\n  - *CIR v. COA* (218 SCRA 203 [1993]): COA's post-audit authority.\r\n  - *DBP v. COA* (231 SCRA 202 [1994]) and *Blue Bar Coconut Philippines v. Tantuico* (163 SCRA 716 [1988]): Scope of post-audit and fiscal accountability.\r\n\r\n---\r\n\r\n### Page 35: Chapter 1 Summary & Master Case Index\r\n- **Core Synthesis:** Chapter 1 establishes that philosophy and law are fundamentally complementary. Law provides the compulsory framework of social order; philosophy provides the critical principles of reason and justice that animate statutory interpretation. The Philippine legal system combines a rich Roman-civil law substantive heritage with an American constitutional structure anchored on separation of powers, judicial review, and independent constitutional commissions.\r\n- **List of Chapter 1 Landmark Cases for Comprehensive Study:**\r\n  1. *Tecson v. Salas*, 34 SCRA 275 (1970)\r\n  2. *Francisco v. House of Representatives*, 415 SCRA 44 (2003)\r\n  3. *Estrada v. Desierto*, 353 SCRA 452 (2001)\r\n  4. *Alonzo v. Intermediate Appellate Court*, 150 SCRA 259 (1987)\r\n  5. *League of Cities of the Philippines v. COMELEC*, 608 SCRA 636 (2009)\r\n  6. *Dumaguete Cathedral Credit Cooperative v. CIR*, 610 SCRA 652 (2010)\r\n  7. *Angara v. Electoral Commission*, 63 Phil. 139 (1936)\r\n  8. *Villena v. Secretary of the Interior*, 67 Phil. 464 (1939)\r\n  9. *Luego v. Civil Service Commission*, 143 SCRA 327 (1986)\r\n  10. *Gallardo v. Tabamo*, 218 SCRA 253 (1993)\r\n\r\n---\r\n\r\n# CHAPTER 2: SCHOOLS OF THOUGHT (Pages 36 to 66)\r\n\r\n---\r\n\r\n### Page 36: Introduction to Schools of Thought & Classical Theory of Criminal Law\r\n- **Epigraph:** John Locke (*Second Treatise of Civil Government*): Freedom under government is having a standing, known rule to live by, common to all members of society, made by the legislative authority, and not being subject to the arbitrary will of another man.\r\n- **The Two Divergent Philosophies of Criminal Law (Prof. Lohel Martirez):**\r\n  - **The Classical / Juristic School:**\r\n    - Underpinned the Spanish Penal Code of 1870 and the Philippine Revised Penal Code (Act No. 3815).\r\n    - *Core Tenet:* Man is a moral agent gifted with absolute free will to choose between good and evil.\r\n    - *Accountability & Penalty:* An individual is held legally liable because he freely and voluntarily chose to commit a wrongful act. Penalty is retributive—punishment is meted out in proportion to the objective gravity and result of the felonious act (*an eye for an eye*).\r\n\r\n---\r\n\r\n### Page 37: The Positivist School of Criminology\r\n- **Core Concepts:**\r\n  - **The Positivist / Realistic School:**\r\n    - Pioneered by Italian criminologists Cesare Lombroso, Rafael Garofalo, and Enrico Ferri.\r\n    - *Core Tenet:* Rejects free will. The criminal is viewed as a socially and biologically conditioned creature, driven to crime by hereditary deficiencies, psychological illness, economic distress, and social environment.\r\n    - *Penalty & Purpose:* Crime is a social disease; the criminal is a sick patient. Punishment is not retributive vengeance, but preventive, curative, rehabilitative, and protective of society (measures of security and indeterminate sentencing).\r\n\r\n---\r\n\r\n### Page 38: Natural Law Theory & The Philosophical Basis of Contracts\r\n- **Core Concepts:**\r\n  - **Promise as Moral Basis:** Natural law views contractual obligation as rooted in the inherent moral duty to keep one's solemn word (*Pacta sunt servanda*).\r\n- **Case Spotlight:**\r\n  - **Mobil Oil Philippines, Inc. v. Diocares, 29 SCRA 656 (1969) (Ponente: Justice Fernando):**\r\n    - *Facts:* Diocares executed an unrecorded real estate mortgage in favor of Mobil Oil to secure a loan. Diocares defaulted, and Mobil Oil moved to foreclose. The trial court refused foreclosure on the ground that under Article 2125 of the Civil Code, a mortgage must be recorded in the Registry of Property to be legally constituted.\r\n    - *Ruling:* The Supreme Court reversed. While recording is necessary to bind third persons, an unrecorded mortgage is nonetheless a binding contract between the parties. Citing Chief Justice Marshall in *Sturges v. Crowninshield* and Chief Justice Taney in *Charles River Bridge*, Justice Fernando traced the binding force of a contract to natural law: the moral obligation inherent in a promise creates a legal nexus between the promisor and promisee.\r\n\r\n---\r\n\r\n### Page 39: Natural Rights vs. Civil Rights\r\n- **Core Concepts:**\r\n  - **Natural Rights:** Rights that appertain to man by virtue of his very existence as a rational human being endowed by his Creator (e.g., life, bodily integrity, liberty). They precede governments and constitutions.\r\n  - **Civil Rights:** Rights created, delineated, and protected by positive constitutional and statutory law to enable men to live peacefully in a civil commonwealth.\r\n- **Authority:** Justice Reynato S. Puno's landmark Separate Opinion in *Republic v. Sandiganbayan* (407 SCRA 10 [2003]).\r\n\r\n---\r\n\r\n### Page 40: The EDSA Interregnum — PCGG and the Search of Elizabeth Dimaano's Home\r\n- **Case Background:**\r\n  - **Republic v. Sandiganbayan, 407 SCRA 10 (2003):**\r\n    - *Facts:* Following the February 1986 EDSA Revolution, President Corazon Aquino created the Presidential Commission on Good Government (PCGG) to recover ill-gotten wealth. An AFP Anti-Graft Board raided the home of Elizabeth Dimaano, confidential secretary of General Fabian Ver, seizing millions of pesos in cash, firearms, and property without a judicial search warrant. Dimaano moved to suppress the seized evidence, invoking the Bill of Rights (unreasonable search and seizure).\r\n\r\n---\r\n\r\n### Page 41: Exclusionary Rule & Natural Law During Constitutional Interregnums\r\n- **Judicial Analysis in Republic v. Sandiganbayan:**\r\n  - *The Constitutional Dilemma:* During the revolutionary interregnum (February 25 to March 24, 1986), before the adoption of the Provisional Freedom Constitution, the 1973 Constitution was abrogated. Did the Bill of Rights exist during this interregnum?\r\n  - *Justice Puno's Natural Law Doctrine:* The majority held the revolutionary government was not bound by the 1973 Bill of Rights. However, Justice Puno asserted that human rights are grounded in *natural law* and international covenants (UDHR, ICCPR). Even in the absence of a written constitution, the revolutionary government was bound by the natural and moral law respecting fundamental human dignity and privacy.\r\n\r\n---\r\n\r\n### Page 42: Legal Positivism — The Three Theoretical Commitments\r\n- **Core Concepts:**\r\n  - Legal Positivism arose in stark opposition to natural law. As synthesized by modern jurisprudence (Wrenn), it rests on three core tenets:\r\n    1. **The Social Fact Thesis:** The existence and content of law depend fundamentally on social facts (what sovereign officials or institutions have enacted or recognized), not on moral merits.\r\n    2. **The Conventionality Thesis:** The social facts that validate law are authoritative by virtue of an official social convention or consensus among legal officials.\r\n    3. **The Separability Thesis:** There is no necessary conceptual overlap between law and morality. What law *is* is distinct from what law *ought to be*.\r\n\r\n---\r\n\r\n### Page 43: H.L.A. Hart and the Rule of Recognition\r\n- **Core Concepts:**\r\n  - **Primary vs. Secondary Rules:** In *The Concept of Law*, H.L.A. Hart explained that primitive societies possess only primary rules of obligation. A mature legal system requires *secondary rules*: rules of change, rules of adjudication, and the supreme *Rule of Recognition*.\r\n  - **The Rule of Recognition:** The ultimate criterion of legal validity in a society. It is authoritative not because it is morally good, but because legal officials socially accept its criteria for identifying valid laws.\r\n\r\n---\r\n\r\n### Page 44: The Separability Thesis & Judicial Application\r\n- **Core Concepts:**\r\n  - **Separability Thesis Detailed:** Denies the Naturalist \"Overlap Thesis.\" A rule does not cease to be a valid legal rule merely because it violates an ethical precept.\r\n- **Case Reference:**\r\n  - **Switzerland General Insurance Co. v. Republic, 32 SCRA 227 (1970):** Adherence to positive rules of procedure and statutory jurisdiction cannot be abandoned on mere sentimental notions of equity.\r\n\r\n---\r\n\r\n### Page 45: John Austin's Command Theory of Law\r\n- **Core Concepts:**\r\n  - **The Imperative / Command Theory:** John Austin defined law as *\"the command of a sovereign, backed by the threat of sanction, and habitually obeyed by the bulk of the population.\"*\r\n  - **Critique of Blackstone:** Austin attacked Sir William Blackstone's famous declaration in *Commentaries on the Laws of England* that positive law conflicting with natural law is void. Austin countered: *\"To prove by pertinent reasons that a law is pernicious is highly useful... but to say that human laws which conflict with Divine law have no validity is to preach anarchy.\"* An unjust law, if commanded by the sovereign, is still law.\r\n\r\n---\r\n\r\n### Page 46: Separability Thesis: Law as It Is vs. Law as It Ought to Be\r\n- **Core Concepts:**\r\n  - **Descriptive vs. Normative:** Positivism insists on a rigorous methodological boundary between the science of jurisprudence (describing what the law *is*) and the science of legislation/ethics (arguing what the law *ought to be*).\r\n  - **Moral Criticism Remains:** Positivists do not deny that laws can be morally criticized; they simply insist that an unjust law remains legally binding until officially repealed or invalidated through recognized institutional procedures.\r\n\r\n---\r\n\r\n### Page 47: The Modern Counter-Resurgence of Natural Law\r\n- **Core Concepts:**\r\n  - **The Nazi Experience & Totalitarianism:** The atrocities committed under Nazi Germany—where judges and officials mechanically applied statutory enactments under the positivist defense of *\"Gesetz ist Gesetz\"* (Law is Law)—shook the foundations of pure legal positivism.\r\n  - **Natural Law as a Protective Bulwark:** Natural law remains a vital intellectual bulwark against tyranny. Gustav Radbruch's Formula (*extreme injustice is no law*) reaffirmed that when positive law actively denies equality and justice, it forfeits its character as law.\r\n\r\n---\r\n\r\n### Page 48: Legal Realism — Revolt Against Formalism\r\n- **Core Concepts:**\r\n  - **The Realist Revolt:** Emerged in the United States in the early 20th century as a revolt against *Legal Formalism* (which treated legal reasoning as a purely deductive, mechanical syllogism: Major Premise = Statute; Minor Premise = Facts; Conclusion = Automatic Ruling).\r\n  - **Oliver Wendell Holmes Jr.:** Famously declared in *The Common Law*: *\"The life of the law has not been logic: it has been experience.\"* Realists argued that judges decide based on facts, intuition, social policy, and economic reality, and rationalized their conclusions with legal rules post hoc.\r\n\r\n---\r\n\r\n### Page 49: Realism in Constitutional Adjudication & Gomez v. Palomar\r\n- **Core Concepts:**\r\n  - **Justice Felix Frankfurter:** A leading exponent of judicial realism, cautioning against turning the Equal Protection clause into an abstract mathematical formula (*Nashville, C. & St. L. Ry. v. Browning*).\r\n- **Case Spotlight:**\r\n  - **Gomez v. Palomar, 25 SCRA 827 (1968):**\r\n    - *Facts:* Republic Act No. 1635 required the collection of an additional 5-centavo anti-tuberculosis stamp on all mail posted during the anti-TB fund drive. Petitioner challenged the law as discriminatory and violative of equal protection, arguing that users of mail were arbitrarily singled out to fund a general public health problem.\r\n    - *Ruling:* The Supreme Court rejected the formalistic challenge. Realistic judicial scrutiny recognizes that the legislature must have wide latitude in classification. Eradicating tuberculosis is a paramount public welfare objective, and classifying mail users was reasonably related to raising funds for this purpose.\r\n\r\n---\r\n\r\n### Page 50: The Operative Fact Doctrine — Municipality of Malabang v. Benito\r\n- **Landmark Case Analysis:**\r\n  - **Municipality of Malabang v. Benito, 27 SCRA 533 (1969) (Ponente: Justice Makalintal):**\r\n    - *Facts:* President Carlos P. Garcia issued Executive Order No. 386 creating the Municipality of Balabagan out of several barrios of the Municipality of Malabang pursuant to Section 68 of the Revised Administrative Code. In *Pelaez v. Auditor General* (15 SCRA 569 [1965]), the Supreme Court declared Section 68 unconstitutional because creating municipalities is an exclusively legislative function that cannot be delegated to the President. Relying on *Pelaez*, petitioners sought to nullify Balabagan and restrain its municipal officials from exercising authority.\r\n    - *Legal Issue:* When a statute or executive order is declared unconstitutional, is it treated as though it never existed (*Norton v. Shelby County* doctrine of void ab initio), or must the law recognize its real-world consequences under the *Operative Fact Doctrine*?\r\n\r\n---\r\n\r\n### Page 51: Operative Fact Doctrine Continued — Realism over Fiction\r\n- **Ruling & Jurisprudential Takeaway in Malabang v. Benito:**\r\n  - Citing *Chicot County Drainage District v. Baxter State Bank* (308 U.S. 371), the Supreme Court recognized the **Doctrine of Operative Fact**:\r\n    - Under the traditional orthodox view (*Norton v. Shelby County*), an unconstitutional act confers no rights, imposes no duties, and is as inoperative as though it had never been passed.\r\n    - Under the modern **realistic view**, the actual existence of a statute or executive order prior to its determination of unconstitutionality is an operative fact. People relied on it, officials were elected, contracts were entered into, and rights were exercised. The past cannot always be erased by a new judicial declaration. Balabagan existed as a de facto municipal corporation during its active period, and its acts cannot be summarily wiped out without creating massive social chaos.\r\n\r\n---\r\n\r\n### Page 52: Judicial Realism in Taxation and Equal Protection\r\n- **Core Concepts:**\r\n  - **Equal Protection Realism:** Justice Frankfurter noted in *Tigner v. Texas* that equal protection does not demand identity of treatment. Realism requires taking account of the real-world differences between distinct business and social classes.\r\n- **Authorities:**\r\n  - *Sison, Jr. v. Ancheta* (130 SCRA 654 [1984]): Realism applied to gross income taxation vs. net income taxation.\r\n  - *De la Cruz v. Court of Appeals* (305 SCRA 303 [1999]): Realism in evaluating public officers' administrative liability.\r\n  - *Luzon Brokerage Co. v. Maritime Building Co.* (86 SCRA 305 [1978]): Commercial reality governs breach of contracts.\r\n\r\n---\r\n\r\n### Page 53: Stare Decisis et Non Quieta Movere & Article 8 of the Civil Code\r\n- **Core Concepts:**\r\n  - **Article 8 of the Civil Code:** *\"Judicial decisions applying or interpreting the laws or the Constitution shall form part of the legal system of the Philippines.\"*\r\n  - **The Doctrine of Stare Decisis:** *\"Stand by things decided and do not disturb settled points.\"* Once a case has established a legal principle on a particular set of facts, that principle must be applied to all future cases involving substantially identical facts.\r\n  - **Purpose:** Fosters certainty, stability, equal justice, and predictability in social and commercial dealings.\r\n\r\n---\r\n\r\n### Page 54: Stare Decisis vs. The Constitution — The Casey Framework\r\n- **Core Discussion & Landmark Test:**\r\n  - **Constitutional Exceptions to Stare Decisis:** Stare decisis is not an inflexible straitjacket. As Justice Frankfurter observed: *\"The ultimate touchstone of constitutionality is the Constitution itself, not what we have said about it.\"*\r\n- **Landmark Case:**\r\n  - **Lambino v. Commission on Elections, 505 SCRA 160 (2006):**\r\n    - The Supreme Court, in refusing to overrule *Santiago v. COMELEC* (270 SCRA 106) regarding the inadequacy of Republic Act No. 6735 for People's Initiative on constitutional revisions, adopted the U.S. Supreme Court's four-prong prudential framework from **Planned Parenthood of Southeastern Pennsylvania v. Casey (505 U.S. 833 [1992])**.\r\n\r\n---\r\n\r\n### Page 55: The Four Casey Prongs Applied in Lambino v. COMELEC\r\n- **The Four Casey Prongs for Overruling Constitutional Precedent:**\r\n  Before overruling a prior constitutional ruling, the Court must examine:\r\n  1. **Practical Workability:** Has the rule proved to be intolerable simply in defying practical workability?\r\n  2. **Reliance:** Is the rule subject to the kind of reliance that would lend special hardship to the consequences of overruling and add inequity to the cost of repudiation?\r\n  3. **Evolution of Legal Principles:** Have related principles of law developed so far as to have left the old rule no more than a remnant of abandoned doctrine?\r\n  4. **Change of Facts:** Have facts, or our understanding of facts, changed so fundamentally as to have robbed the old rule of its significant application or justification?\r\n- The Court held that none of these factors favored abandoning precedent in *Lambino*.\r\n\r\n---\r\n\r\n### Page 56: Oliver Wendell Holmes Jr. — The Bad Man Theory of Law\r\n- **Core Text Analysis (*The Path of the Law* [1897]):**\r\n  - **The Bad Man Perspective:** To understand the true nature of law, look at it not from the perspective of the moral philosopher or the virtuous citizen, but through the eyes of the **Bad Man**:\r\n    - The bad man does not care about ethical duties, conscience, or abstract morality.\r\n    - What he cares about is: *What will happen to me if I do this act? Will the police arrest me? Will the judge send me to prison? Will the sheriff seize my property?*\r\n  - **Law as Prophecy:** *\"The prophecies of what the courts will do in fact, and nothing more pretentious, are what I mean by the law.\"*\r\n\r\n---\r\n\r\n### Page 57: Holmes's Separation of Law from Ethics\r\n- **Core Concepts:**\r\n  - **Avoiding Confusion:** Holmes argued that confusing legal ideas with moral ideas leads to intellectual blindness. Legal rights and duties are simply state sanctions attached to particular human actions.\r\n  - **Historical Evolution:** Law reflects the felt necessities of the time, prevalent moral and political theories, intuitions of public policy, and prejudices of judges—not immutable abstract logic.\r\n\r\n---\r\n\r\n### Page 58: Ronald Dworkin's Interpretivism & Constructivism\r\n- **Core Concepts:**\r\n  - **Rejection of Positivist Discretion:** Ronald Dworkin (*Taking Rights Seriously*, *Law's Empire*) rejected Hart's positivism. In \"hard cases\" where positive rules run out, judges do not exercise unfettered, quasi-legislative discretion.\r\n  - **Rules vs. Principles:**\r\n    - *Rules* apply in an all-or-nothing fashion (e.g., speed limits, 30-day deadlines).\r\n    - *Principles* have the dimension of weight and moral gravity (e.g., *\"No man shall profit from his own wrong\"*).\r\n  - **Law as Integrity:** Judges must interpret the law constructivistically, finding the coherent moral theory that best fits and justifies the community's legal history and constitutional commitments.\r\n\r\n---\r\n\r\n### Page 59: Salvacion v. Central Bank of the Philippines — Hard Cases and Conscience\r\n- **Case Spotlight:**\r\n  - **Salvacion v. Central Bank of the Philippines, 278 SCRA 27 (1997) (Ponente: Justice Torres):**\r\n    - *Facts:* Karen Salvacion, a 12-year-old Filipina child, was abducted and repeatedly raped over four days by Greg Bartelli, an American tourist. Bartelli was arrested and faced trial. In the civil aspect, the trial court awarded Salvacion Php 1 million in damages. To satisfy the judgment, a notice of garnishment was served on Bartelli's dollar deposit with China Banking Corporation. China Bank and the Central Bank refused to comply, citing Section 113 of Central Bank Circular No. 960 and Section 8 of Republic Act No. 6426 (Foreign Currency Deposit Act), which explicitly provided that foreign currency deposits are *\"exempt from attachment, garnishment, or any other order or process of any court.\"*\r\n\r\n---\r\n\r\n### Page 60: Salvacion v. Central Bank — Overcoming Legal Tyranny\r\n- **Ruling & Jurisprudential Takeaway:**\r\n  - *Legal & Philosophical Issue:* Should the absolute statutory secrecy of foreign currency deposits be enforced to shield a foreign felon from paying civil indemnity to his child rape victim?\r\n  - *Ruling:* The Supreme Court ordered China Bank to release the dollar deposits to satisfy the civil indemnity. The Court denounced the literal application of the statute as an engine of injustice: *\"In the fine print of terms, the exemption was designed to encourage foreign depositors to invest foreign currency in the Philippine banking system... It was never intended to establish a safe haven for foreign criminals to mock our penal laws and evade civil liability to victims of their heinous crimes.\"*\r\n  - **Constructivist Doctrine:** Human rights and justice prevail over statutory formalism. Literalism must surrender to human conscience.\r\n\r\n---\r\n\r\n### Page 61: Statutory Construction and Equity & People v. Acierto\r\n- **Core Concepts:**\r\n  - **Vehement Urge of Conscience:** When statutory text is ambiguous or silent, courts must adopt that interpretation which responds to the vehement urge of human conscience (*Padilla v. Padilla*, 74 Phil. 377).\r\n- **Case Spotlight:**\r\n  - **People v. Acierto, 92 Phil. 534 (1953):**\r\n    - *Facts:* Acierto was charged with estafa for falsifying records in connection with civilian construction work inside a U.S. military base in the Philippines. He argued that under the Military Bases Agreement, exclusive jurisdiction over offenses committed inside the base was vested in U.S. military authorities.\r\n\r\n---\r\n\r\n### Page 62: Constructivist Treaty Interpretation in People v. Acierto\r\n- **Ruling & Jurisprudential Takeaway:**\r\n  - *Ruling:* The Supreme Court held that the Philippine courts possessed valid jurisdiction.\r\n  - *Constructivist Analysis:* Acierto was a Filipino civilian, working at his own discretion, not an enlisted member of the armed forces of the United States. Provisions granting foreign military exceptional extraterritorial jurisdiction over civilians must be strictly construed to protect national territorial sovereignty. The primary purpose of the treaty was military defense, not exempting civilians from domestic criminal liability.\r\n\r\n---\r\n\r\n### Page 63: Hans Kelsen's Pure Theory of Law (Reine Rechtslehre)\r\n- **Core Concepts:**\r\n  - **Purification of Jurisprudence:** Hans Kelsen sought to construct a \"pure\" science of law, stripped of all extraneous elements: sociology, psychology, ethics, biology, and political ideology.\r\n  - **The Normative Realm:** Law belongs to the realm of *Ought* (*Sollen*), governed by imputation, distinct from the physical realm of *Is* (*Sein*), which is governed by empirical causality.\r\n  - **The Grundnorm (Basic Norm):** The ent
