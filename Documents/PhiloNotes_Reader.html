y integrity, and freedom from arbitrary state terror.\n\n---\n\n### Memory Checklists & Key Traps\n\n- ⚠️ **Exam Trap:** Confusing Plato's theory of punishment with modern retributive criminal law.\n  - *Correction:* Plato believed crime reflects ignorance and defective socialization. In his ideal state, **rational education and persuasion** supersede retributive punishment.\n- ⚠️ **Exam Trap:** Believing Aristotle considered all forms of democracy as virtuous.\n  - *Correction:* Aristotle classified pure democracy as a **perverted form** (rule by the poor/mob for selfish interest). The good form of rule by the many is **Polity** (a constitutional republic anchored on a stable middle class).\n- ⚠️ **Exam Trap:** Assuming Aquinas believed Natural Law alone is sufficient for human salvation.\n  - *Correction:* Natural Law (*Lex Naturalis*) guides man to his *natural* earthly flourishing; **Divine Law (*Lex Divina*)** via revelation is indispensable for man to realize his *supernatural* beatitude.\n"}};

    /* ==========================================================================
       FALLBACK SIMPLE MARKDOWN PARSER (In case CDN is blocked)
       ========================================================================== */
    function simpleMarkdownFallback(md) {
      let html = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gim, '<h3 id="$1">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 id="$1">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 id="$1">$1</h1>')
        .replace(/^\> (.*$)/gim, '<blockquote><p>$1</p></blockquote>')
        .replace(/\*\*\*(.*?)\*\*\*/gim, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/^---$/gim, '<hr>')
        .replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>')
        .replace(/<\/ul>\s*<ul>/gim, '');
      return html.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
    }

    function renderMarkdown(md) {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(md);
      } else {
        return simpleMarkdownFallback(md);
      }
    }

    const articleContent = document.getElementById("article-content");

    // Populate Document Pills
    function populateDocList() {
      docList.innerHTML = "";
      for (const [key, doc] of Object.entries(bundledDocs)) {
        const btn = document.createElement("button");
        btn.className = `doc-pill ${key === activeDocKey ? "active" : ""}`;
        btn.innerHTML = doc.label;

        docList.appendChild(btn);

    // Load and Display Document
    function loadDocument(key) {
      activeDocKey = key;

      populateDocList();

    function renderActiveDoc() {
      articleContent.innerHTML = renderMarkdown(activeMarkdown);
      wrapTables();
      buildTOC();
      enhanceCaseBadges();
      clearSearch();
    }

    // Wrap tables for responsive horizontal scrolling
    function wrapTables() {
      const tables = articleContent.querySelectorAll("table");
      tables.forEach(table => {
        if (!table.parentElement.classList.contains("table-responsive")) {
          const wrapper = document.createElement("div");
          wrapper.className = "table-responsive";
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        }
      });
    }

    // Auto-generate Interactive Table of Contents
    function buildTOC() {
      tocList.innerHTML = "";
      const headings = articleContent.querySelectorAll("h1, h2, h3");

      headings.forEach((heading, idx) => {
        if (!heading.id) {
          heading.id = "heading-" + idx + "-" + heading.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-");
        }

        const li = document.createElement("li");
        const level = heading.tagName.toLowerCase() === "h1" ? 1 : heading.tagName.toLowerCase() === "h2" ? 2 : 3;
        li.className = `toc-item level-${level}`;

        const a = document.createElement("a");
        a.href = "#" + heading.id;
        a.textContent = heading.textContent.replace(/^#+\s*/, "");
        a.onclick = (e) => {
          e.preventDefault();
          const targetEl = document.getElementById(heading.id);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: "smooth" });
          }
          if (isMobile()) {
            closeSidebarMobile();
          }
        };

        li.appendChild(a);
        tocList.appendChild(li);
      });

      setupScrollSpy();
    }

    // Add interactive click-to-copy citation badge on cases
    function enhanceCaseBadges() {
      const strongElements = articleContent.querySelectorAll("strong");
      strongElements.forEach((el) => {
        const text = el.textContent;
        if (text.includes(" v. ") || text.includes(" vs. ") || text.includes("In re")) {
          el.style.cursor = "pointer";
          el.title = "Click to copy case title/citation";
          el.onclick = () => {
            navigator.clipboard.writeText(text);
            showToast("Copied: " + text);
          };
        }
      });
    }

    // ScrollSpy Active TOC Highlighting
    function setupScrollSpy() {
      const headings = Array.from(articleContent.querySelectorAll("h1, h2, h3"));
      const tocLinks = Array.from(tocList.querySelectorAll("a"));

      window.onscroll = () => {
        // Reading Progress Bar
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        progressBar.style.width = scrolled + "%";

        // Scrollspy
        let currentHeadingId = "";
        const scrollPosition = window.scrollY + 100;

        for (let i = headings.length - 1; i >= 0; i--) {
          if (headings[i].offsetTop <= scrollPosition) {
            currentHeadingId = headings[i].id;
            break;
          }
        }

        tocLinks.forEach((link) => {
          const li = link.parentElement;
          if (link.getAttribute("href") === "#" + currentHeadingId) {
            li.classList.add("active");
          } else {
            li.classList.remove("active");
          }
        });
      };
    }

    function updateSearchInputs(val) {
      if (searchInput && searchInput.value !== val) searchInput.value = val;
      if (sidebarSearchInput && sidebarSearchInput.value !== val) sidebarSearchInput.value = val;
    }

    function updateSearchCount(text) {
      if (searchCount) searchCount.textContent = text;
      if (sidebarSearchCount) sidebarSearchCount.textContent = text;
    }

    function handleSearchInput(e) {
      const query = e.target.value.trim();
      updateSearchInputs(e.target.value);
      if (!query) {
        clearSearch();
        return;
      }
      performSearch(query);
    }

    if (searchInput) {
      searchInput.addEventListener("input", handleSearchInput);
    }
    if (sidebarSearchInput) {
      sidebarSearchInput.addEventListener("input", handleSearchInput);
      sidebarSearchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && isMobile()) {
          closeSidebarMobile();
        }
      });
    }

    function clearSearch() {
      const marks = articleContent.querySelectorAll("mark.search-match");
      marks.forEach(m => {
        const parent = m.parentNode;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
      });
      updateSearchCount("");
      searchMatches = [];
      currentMatchIndex = -1;
    }

    function performSearch(query) {
      clearSearch();
      if (query.length < 2) return;

      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
      const walker = document.createTreeWalker(articleContent, NodeFilter.SHOW_TEXT, null, false);
      const textNodes = [];

      while (walker.nextNode()) {
        if (walker.currentNode.parentNode.tagName !== "SCRIPT" && 
            walker.currentNode.parentNode.tagName !== "STYLE" &&
            walker.currentNode.nodeValue.match(regex)) {
          textNodes.push(walker.currentNode);
        }
      }

      textNodes.forEach(node => {
        const span = document.createElement("span");
        span.innerHTML = node.nodeValue.replace(regex, '<mark class="search-match">$1</mark>');
        node.parentNode.replaceChild(span, node);
      });

      searchMatches = Array.from(articleContent.querySelectorAll("mark.search-match"));
      updateSearchCount(`${searchMatches.length} found`);

      if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        searchMatches[0].classList.add("current");
        searchMatches[0].scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

        }
      } else {
        const isCollapsed = sidebar.classList.toggle("collapsed");
        toggleSidebarBtn.setAttribute("aria-expanded", !isCollapsed);
        toggleSidebarBtn.title = isCollapsed ? "Expand Sidebar (Ctrl+B)" : "Collapse Sidebar (Ctrl+B)";
        try {
          localStorage.setItem("philo_sidebar_collapsed", isCollapsed ? "1" : "0");
        } catch(e) {}
      }
    }

    toggleSidebarBtn.onclick = toggleSidebar;
    if (closeSidebarBtn) closeSidebarBtn.onclick = closeSidebarMobile;
    if (sidebarBackdrop) sidebarBackdrop.onclick = closeSidebarMobile;

    // Restore desktop preference on load
    try {
      if (!isMobile() && localStorage.getItem("philo_sidebar_collapsed") === "1") {
        sidebar.classList.add("collapsed");
        toggleSidebarBtn.setAttribute("aria-expanded", "false");
        toggleSidebarBtn.title = "Expand Sidebar (Ctrl+B)";
      }
    } catch(e) {}

    // Close on mobile when Escape key pressed
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isMobile() && sidebar.classList.contains("open")) {
        closeSidebarMobile();
      }
    });

    // Auto-close mobile drawer if resized to desktop
    window.addEventListener("resize", () => {
      if (!isMobile() && sidebar.classList.contains("open")) {
        closeSidebarMobile();
      }
    });

    // Print & Scroll Top FABs
    document.getElementById("print-btn").onclick = () => window.print();
    document.getElementById("scroll-top-btn").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

    // Custom File Opener
    const fileInput = document.getElementById("file-input");
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const customKey = "custom_" + Date.now();
        bundledDocs[customKey] = {
          label: "📄 " + file.name,
          content: event.target.result
        };
        loadDocument(customKey);
        showToast("Loaded: " + file.name);
      };
      reader.readAsText(file);
    });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        toggleSidebar();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
        e.preventDefault();
        if (isMobile()) {
          openSidebarMobile();
        } else {
          searchInput.focus();
        }
      }
    });

    // Initial Load
    populateDocList();
    renderActiveDoc();
  </script>
</body>
</html>
